<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Memos | My Web Site</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
</head>
<body>

  <!-- 共通ヘッダー -->
  <header class="header" id="header-include"></header>

  <main class="container">
    <h1 class="page-title">気になったポストと雑記</h1>

    <!-- 記事1ブロック -->
    <article class="post-card">
      <h2 class="post-title">タイトルやテーマ（例：気になるAI技術について）</h2>
      <p class="post-date">2026-07-26</p>
      
      <!-- Xの埋め込みコードをここに貼り付ける -->
      <div class="x-embed">
        <blockquote class="twitter-tweet"><p lang="ja" dir="ltr">（ここにコピーしたコードを貼る）</p></blockquote>
        <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
      </div>

      <!-- 自分のコメント・感想 -->
      <div class="post-comment">
        <p>ここにポストに対する自分の意見や感想をあれこれ書きます。</p>
        <p>長文になっても改行タグや段落で整理して書くことができます。</p>
      </div>
    </article>

    <!-- 記事2ブロック（増やしたい時はここを複製） -->
    <article class="post-card">
      <h2 class="post-title">次の気になるポスト</h2>
      ...
    </article>
  </main>

  <!-- 共通フッター -->
  <footer id="footer-include"></footer>

</body>
</html>
