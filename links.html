<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links | かなたへ</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
</head>
<body>

  <!-- 共通ヘッダー -->
  <header class="header" id="header-include"></header>

  <main class="container">
    <!-- プロフィール部分 -->
    <section class="profile">
      <img src="images/profile.jpeg" alt="プロフィール画像" class="profile-icon">
      <h1 class="profile-name">かなたへ</h1>
      <p class="profile-bio">SNSアカウントやYouTubeチャンネルのまとめページです。</p>
    </section>

    <!-- リンクボタン群 -->
    <section class="links">
      <a href="https://x.com/faun157" target="_blank" rel="noopener noreferrer" class="link-card">
        <img src="images/x-main-icon.jpeg" alt="X Main" class="btn-icon">
        <span>X (Main Account)</span>
      </a>

      <a href="https://x.com/NipponSuppon" target="_blank" rel="noopener noreferrer" class="link-card">
        <img src="images/x-sub-icon.jpeg" alt="X Sub" class="btn-icon">
        <span>X (Sub Account)</span>
      </a>

      <a href="https://youtube.com/@Kanatahe-YouTube" target="_blank" rel="noopener noreferrer" class="link-card">
        <img src="images/youtube-icon.jpeg" alt="YouTube" class="btn-icon">
        <span>YouTube Channel</span>
      </a>
    </section>
  </main>

  <!-- 共通フッター -->
  <footer id="footer-include"></footer>

</body>
</html>
